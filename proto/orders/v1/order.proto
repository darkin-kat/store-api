syntax = "proto3";

package orders.v1;

option go_package = "github.com/darkin-kat/store-api/gen/orders/v1;ordersv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_DELIVERED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  double price = 3;
  int32 quantity = 4;
}

message Order {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string user_email = 4;
  map<string, OrderItem> items = 5;
  OrderStatus status = 6;
  double total_amount = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/v1/orders/{id}"
    };
  }

  rpc ListUserOrders(ListUserOrdersRequest) returns (ListUserOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/orders"
    };
  }

  rpc SetOrderStatus(SetOrderStatusRequest) returns (SetOrderStatusResponse) {
    option (google.api.http) = {
      patch: "/v1/orders/{id}/status"
      body: "*"
    };
  }
}

message CreateOrderRequest {
  string user_id = 1;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListUserOrdersRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListUserOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message SetOrderStatusRequest {
  string id = 1;
  OrderStatus status = 2;
}

message SetOrderStatusResponse {
  Order order = 1;
}